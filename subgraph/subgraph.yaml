specVersion: 1.0.0
description: bitapple Substreams-powered-Subgraph
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: substreams
    name: bitapple
    network: solana-devnet
    source:
      package:
        moduleName: map_program_data
        file: ../bitapple-v0.1.0.spkg
    mapping:
      apiVersion: 0.0.7
      kind: substreams/graph-entities
      file: ./src/mappings.ts
      handler: handleTriggers